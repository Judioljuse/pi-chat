# Plain:      docker compose up -d                 (http://localhost:8080)
# Tailscale:  TS_AUTHKEY=tskey-... PICHAT_PUBLIC_URL=https://pichat.<tailnet>.ts.net \
#             docker compose --profile tailscale up -d
# First start prints a one-time admin link: docker compose logs pichat
services:
  pichat:
    build:
      context: .
      args:
        GOPROXY: ${GOPROXY:-https://goproxy.cn,direct}
    image: pichat:latest
    restart: unless-stopped
    environment:
      PICHAT_PUBLIC_URL: ${PICHAT_PUBLIC_URL:-http://localhost:8080}
      TZ: ${TZ:-Asia/Shanghai}
      PICHAT_UPDATE: ${PICHAT_UPDATE:-on}
      PICHAT_UPDATE_MIRROR: ${PICHAT_UPDATE_MIRROR:-}
    ports:
      - "${PICHAT_PORT:-127.0.0.1:8080}:8080"
    volumes:
      - pichat-data:/data

  tailscale:
    profiles: ["tailscale"]
    image: tailscale/tailscale:latest
    hostname: ${TS_HOSTNAME:-pichat}
    restart: unless-stopped
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY:?set TS_AUTHKEY}
      TS_STATE_DIR: /var/lib/tailscale
      TS_SERVE_CONFIG: /config/serve.json
      TS_USERSPACE: "true"
    volumes:
      - tailscale-state:/var/lib/tailscale
      - ./deploy/tailscale-serve.json:/config/serve.json:ro
    depends_on:
      - pichat

volumes:
  pichat-data:
  tailscale-state:
