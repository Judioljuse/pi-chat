name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: check tag matches VERSION
        id: ver
        run: |
          ver="$(tr -d '[:space:]' < internal/version/VERSION)"
          tag="${GITHUB_REF_NAME}"
          if [ "$tag" != "v$ver" ]; then
            echo "tag $tag does not match internal/version/VERSION ($ver)" >&2
            exit 1
          fi
          echo "version=$ver" >> "$GITHUB_OUTPUT"

      - name: test
        run: go test ./...

      - name: build
        env:
          VER: ${{ steps.ver.outputs.version }}
        run: |
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            os="${target%/*}"; arch="${target#*/}"
            out="dist/pichat_${VER}_${os}_${arch}"
            echo "$out"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath -ldflags '-s -w' -o "$out" ./cmd/pichat
          done
          cp listener/pichat-listen.mjs dist/
          cd dist && sha256sum pichat_* pichat-listen.mjs > SHA256SUMS && cat SHA256SUMS

      - name: release notes
        id: notes
        run: |
          # The "## vX.Y.Z" section of CHANGELOG.md, up to the next "## " heading.
          awk -v tag="## ${GITHUB_REF_NAME}" '
            $0 == tag { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          if [ -s notes.md ] && grep -q '[^[:space:]]' notes.md; then
            echo "from_changelog=true" >> "$GITHUB_OUTPUT"
          else
            echo "from_changelog=false" >> "$GITHUB_OUTPUT"
          fi

      - name: create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if [ "${{ steps.notes.outputs.from_changelog }}" = "true" ]; then
            gh release create "$TAG" dist/* --title "$TAG" --notes-file notes.md
          else
            gh release create "$TAG" dist/* --title "$TAG" --generate-notes
          fi
